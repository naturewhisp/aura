name: CI Validation

on:
  push:
    branches: [ main, fase6 ]
  pull_request:
    branches: [ main, fase6 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation Suite (Format, Analyze, Test, Build, Manifests)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Shared Dart & Flutter Validation
        uses: ./.github/actions/validate-dart-flutter

      - name: App Flutter Windows Release Build
        shell: pwsh
        run: |
          Set-Location app
          flutter build windows --release

      - name: Validate Runtime & Audio Manifests
        shell: pwsh
        run: |
          if (Test-Path "runtime/runtime-manifest.json") {
              $runtimeManifest = Get-Content -Path "runtime/runtime-manifest.json" -Raw | ConvertFrom-Json
              if ($runtimeManifest.variants.Count -lt 3) {
                  throw "[FAIL-CLOSED] Runtime manifest contains fewer than 3 variants!"
              }
              Write-Host "✅ Runtime manifest valid: $($runtimeManifest.runtimeSetId)"
          } else {
              Write-Host "ℹ️ Runtime manifest non presente in radice di repository (generato durante la fase di release packaging)."
          }

          $audioManifest = Get-Content -Path "distribution/audio/audio-manifest.json" -Raw | ConvertFrom-Json
          foreach ($track in $audioManifest.tracks) {
              $audioFile = "distribution/audio/$($track.filename)"
              if (-not (Test-Path $audioFile)) {
                  throw "[FAIL-CLOSED] Required audio file missing: $audioFile"
              }
              $hash = (Get-FileHash -Path $audioFile -Algorithm SHA256).Hash.ToLower()
              if ($hash -ne $track.sha256.ToLower()) {
                  throw "[FAIL-CLOSED] Audio file SHA-256 mismatch for $audioFile"
              }
          }
          Write-Host "✅ Audio manifest & assets valid: $($audioManifest.audioSetId)"

      - name: Run Actionlint Workflow Linter
        uses: raven-actions/actionlint@v2


