name: aura_app
description: Interfaccia utente Flutter per il terminale A.U.R.A.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  audioplayers: ^6.0.0
  
  # Dipendenza locale per importare il core di gioco deterministico
  aura_core:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
  shaders:
    - assets/shaders/glitch.frag
