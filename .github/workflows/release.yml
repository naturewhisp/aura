name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Semantic Version (e.g. 0.1.0-rc.1 or 0.1.0)'
        required: true
        type: string
      channel:
        description: 'Distribution Channel (dev, beta, stable)'
        required: true
        type: choice
        options:
          - dev
          - beta
          - stable
        default: 'beta'
      release_kind:
        description: 'Release Kind (candidate vs official)'
        required: true
        type: choice
        options:
          - candidate
          - official
        default: 'candidate'
      require_installer:
        description: 'Require Inno Setup Installer'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS Candidate Packaging (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 25
    if: ${{ inputs.release_kind == 'candidate' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Release Parameters
        id: mac-params
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          KIND="${{ inputs.release_kind }}"
          echo "Building macOS asset for version $VER (kind: $KIND)"
          if [ "$KIND" != "candidate" ]; then
            echo "::error::build-macos job must only run for release_kind == 'candidate'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Run Shared Dart & Flutter Validation
        uses: ./.github/actions/validate-dart-flutter

      - name: Build macOS Release Application
        shell: bash
        run: |
          cd app
          flutter build macos --release

      - name: Validate Mach-O Architecture (Fail-Closed)
        shell: bash
        run: |
          APP="app/build/macos/Build/Products/Release/aura_app.app"
          BIN="$APP/Contents/MacOS/aura_app"
          if [ ! -d "$APP" ]; then
            echo "::error::Bundle directory missing: $APP"
            exit 1
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::Executable binary missing: $BIN"
            exit 1
          fi
          ARCHS="$(lipo -archs "$BIN")"
          echo "=== Mach-O Architectures: $ARCHS ==="
          if ! echo "$ARCHS" | grep -qw "arm64"; then
            echo "::error::Binary missing required arm64 architecture, got: $ARCHS"
            exit 1
          fi
          echo "✅ Mach-O architecture strictly verified (contains native arm64: $ARCHS)!"

      - name: Validate Compiled Entitlements & Signature (Fail-Closed)
        shell: bash
        run: |
          APP="app/build/macos/Build/Products/Release/aura_app.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > compiled-entitlements.plist 2>/dev/null
          SANDBOX=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" compiled-entitlements.plist 2>/dev/null || echo "false")
          CLIENT=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.network.client" compiled-entitlements.plist 2>/dev/null || echo "false")
          if [ "$SANDBOX" != "true" ]; then
            echo "::error::com.apple.security.app-sandbox is not true (got: $SANDBOX)"
            rm -f compiled-entitlements.plist
            exit 1
          fi
          if [ "$CLIENT" != "true" ]; then
            echo "::error::com.apple.security.network.client is not true (got: $CLIENT)"
            rm -f compiled-entitlements.plist
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.network.server" compiled-entitlements.plist >/dev/null 2>&1; then
            echo "::error::Forbidden com.apple.security.network.server found in Release entitlements!"
            rm -f compiled-entitlements.plist
            exit 1
          fi
          rm -f compiled-entitlements.plist
          echo "✅ Compiled entitlements & signatures strictly verified!"

      - name: Package macOS Application Bundle (ditto)
        shell: bash
        run: |
          VER="${{ steps.mac-params.outputs.version }}"
          cp -R app/build/macos/Build/Products/Release/aura_app.app AURA.app
          ZIP_NAME="aura-v${VER}-macos-universal.zip"
          ditto -c -k --keepParent AURA.app "$ZIP_NAME"
          echo "=== Checksum SHA256 of $ZIP_NAME ==="
          shasum -a 256 "$ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: Upload macOS Release Candidate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-candidate-asset
          path: aura-v${{ steps.mac-params.outputs.version }}-macos-universal.zip
          retention-days: 5

  release:
    name: Build, Verify, Sign & Draft Release
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [build-macos]
    if: always() && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')

    permissions:
      contents: write

    environment: ${{ inputs.release_kind == 'candidate' && 'release-candidate' || 'release' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve & Validate Release Parameters
        id: params
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim()
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $chan = "${{ inputs.channel }}"
          $kind = "${{ inputs.release_kind }}"
          $reqInst = "${{ inputs.require_installer }}"

          Write-Host "Workflow dispatch: version=$ver, channel=$chan, release_kind=$kind, require_installer=$reqInst"

          $semverRegex = "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$"
          if ($ver -notmatch $semverRegex) {
              throw "[FAIL-CLOSED] Formato SemVer non valido: $ver"
          }

          $isPrerelease = $Matches[4] -ne $null

          if ($kind -eq "candidate" -and -not $isPrerelease) {
              throw "[FAIL-CLOSED] Le release 'candidate' devono avere un suffisso prerelease (es. 0.1.0-rc.1)"
          }

          if ($kind -eq "official") {
              if ("${{ github.ref }}" -ne "refs/heads/main" -and "${{ github.ref }}" -ne "refs/heads/master") {
                  throw "[FAIL-CLOSED] Le release ufficiali 'official/stable' devono provenire esclusivamente dal branch main/master."
              }
              if ($isPrerelease) {
                  throw "[FAIL-CLOSED] Le release 'official' non devono contenere suffissi prerelease"
              }
              if ($chan -ne "stable") {
                  throw "[FAIL-CLOSED] Le release 'official' devono appartenere al canale 'stable'"
              }
              if ($reqInst -ne "true") {
                  throw "[FAIL-CLOSED] Le release 'official/stable' richiedono l'installer Inno Setup"
              }
          }

          if ($chan -eq "beta" -and $reqInst -ne "true") {
              throw "[FAIL-CLOSED] Le release del canale 'beta' richiedono l'installer Inno Setup"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$chan" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_kind=$kind" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "require_installer=$reqInst" -Encoding utf8
          Write-Host "✅ Validazione parametri e policy SemVer completata con successo!"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Inno Setup Compiler (ISCC)
        shell: pwsh
        run: |
          $iscc = Get-Command "iscc" -ErrorAction SilentlyContinue
          if (-not $iscc) {
              Write-Host "Installazione Inno Setup via Chocolatey..."
              choco install innosetup --no-progress -y
              Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\Inno Setup 6" -Encoding utf8
          }

      - name: Core Format Check
        shell: pwsh
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test bin tool
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] Core format check fallito" }

      - name: Core Static Analysis
        shell: pwsh
        run: |
          dart analyze .
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] Core static analysis fallita" }

      - name: Core Unit Tests
        shell: pwsh
        run: |
          dart test
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] Core test suite fallita" }

      - name: App Format Check
        shell: pwsh
        run: |
          Set-Location app
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] App format check fallito" }

      - name: App Static Analysis
        shell: pwsh
        run: |
          Set-Location app
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] App static analysis fallita" }

      - name: App Unit & Widget Tests
        shell: pwsh
        run: |
          Set-Location app
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] App test suite fallita" }

      - name: Acquire Deterministic llama.cpp Runtime Binaries
        shell: pwsh
        run: |
          try {
              & .\tool\fetch_llama_binaries.ps1 -Force
          } catch {
              throw "[FAIL-CLOSED] Acquisizione binari llama.cpp fallita: $($_.Exception.Message)"
          }

      - name: Download macOS Candidate Asset
        if: ${{ steps.params.outputs.release_kind == 'candidate' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-release-candidate-asset
          path: release/

      - name: Validate Downloaded macOS Candidate Asset
        if: ${{ steps.params.outputs.release_kind == 'candidate' }}
        shell: pwsh
        run: |
          $ver = "${{ steps.params.outputs.version }}"
          $macZip = "release\aura-v$ver-macos-universal.zip"
          if (-not (Test-Path $macZip)) {
              throw "[FAIL-CLOSED] Asset macOS atteso non trovato in release/: $macZip"
          }
          $item = Get-Item $macZip
          if ($item.Length -lt 1000000) {
              throw "[FAIL-CLOSED] Asset macOS in release/ ha dimensione non plausibile (< 1MB): $($item.Length) bytes"
          }
          Write-Host "✅ Asset macOS verificato con successo in release/: $macZip ($($item.Length) bytes)" -ForegroundColor Green

      - name: Package Standalone Release
        shell: pwsh
        env:
          CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY }}
          CATALOG_SIGNING_PUBLIC_KEY: ${{ secrets.CATALOG_SIGNING_PUBLIC_KEY }}
          CATALOG_SIGNING_KEY_ID: ${{ secrets.CATALOG_SIGNING_KEY_ID }}
        run: |
          $ver = "${{ steps.params.outputs.version }}"
          $chan = "${{ steps.params.outputs.channel }}"
          $kind = "${{ steps.params.outputs.release_kind }}"
          $reqInst = [bool]::Parse("${{ steps.params.outputs.require_installer }}")
          $tag = "v$ver"

          $params = @{
              Version = $ver
              Channel = $chan
              ReleaseKind = $kind
              ReleaseTag = $tag
              WorkflowRunId = "${{ github.run_id }}"
              WorkflowRunAttempt = "${{ github.run_attempt }}"
              SourceRef = "${{ github.ref }}"
              SourceBranch = "${{ github.ref_name }}"
          }
          if ($reqInst) {
              $params.RequireInstaller = $true
          }
          try {
              & .\tool\package_release.ps1 @params
          } catch {
              throw "[FAIL-CLOSED] Packaging release fallito: $($_.Exception.Message)"
          }

      - name: Verify Release Assets Integrity (Fail-Closed)
        shell: pwsh
        env:
          CATALOG_SIGNING_PUBLIC_KEY: ${{ secrets.CATALOG_SIGNING_PUBLIC_KEY }}
          CATALOG_SIGNING_KEY_ID: ${{ secrets.CATALOG_SIGNING_KEY_ID }}
        run: |
          $ver = "${{ steps.params.outputs.version }}"
          $kind = "${{ steps.params.outputs.release_kind }}"
          $reqInst = [bool]::Parse("${{ steps.params.outputs.require_installer }}")
          $params = @{
              Version = $ver
              ReleaseKind = $kind
          }
          if ($reqInst) {
              $params.RequireInstaller = $true
          }
          if ($kind -eq "candidate") {
              $params.RequireMacOsAsset = $true
          }
          try {
              & .\tool\verify_release_assets.ps1 @params
          } catch {
              throw "[FAIL-CLOSED] Verifiche di integrita degli asset fallite: $($_.Exception.Message)"
          }

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $ver = "${{ steps.params.outputs.version }}"
          $chan = "${{ steps.params.outputs.channel }}"
          $kind = "${{ steps.params.outputs.release_kind }}"
          $sha = "${{ github.sha }}"
          $ref = "${{ github.ref_name }}"

          $runtimeLock = Get-Content "tool/runtime/llama-runtime-lock.json" -Raw | ConvertFrom-Json
          $llamaCppTag = $runtimeLock.llamaCppTag

          $isCandidateMsg = if ($kind -eq "candidate") { "`n> [!WARNING]`n> **TEST BUILD — DO NOT REDISTRIBUTE**`n" } else { "" }
          $macComponent = if ($kind -eq "candidate") { "- **Asset macOS Universale (Experimental Playtest)**: ``aura-v$ver-macos-universal.zip`` (Apple Silicon arm64 / Intel x86_64)`n" } else { "" }
          $macInstructions = if ($kind -eq "candidate") {
@"

## Istruzioni Rapide per Tester macOS (Apple Silicon Playtest)
1. **Download ed Estrazione**: Scarica ed estrai ``aura-v$ver-macos-universal.zip`` per ottenere l'applicazione ``AURA.app``.
2. **Bypass Gatekeeper (Build Sperimentale non firmata)**:
   - Fai click con il tasto destro su ``AURA.app`` -> seleziona **Apri** -> clicca **Apri comunque**;
   - Oppure apri il Terminale ed esegui:
     ```bash
     xattr -cr /percorso/di/AURA.app
     ```
3. **Avvio Backend di Inferenza Locale (Metal)**:
   - Avvia [LM Studio](https://lmstudio.ai/) su Mac (o ``llama-server`` compilato con supporto Metal) in ascolto sulla porta standard ``http://127.0.0.1:1234``;
   - Carica un modello supportato (es. Attore: ``google/gemma-4-12b-it-qat-q4_0`` o ``gemma-2-9b-it``; Valutatore: ``mistralai/ministral-3-3b``).
4. **Sessione di Playtest e Log**:
   - Avvia ``AURA.app`` (si connetterà automaticamente a ``localhost:1234``);
   - Gioca una sessione di almeno 10 turni per consentire la maturazione delle metriche diegetiche;
   - Al termine, condividi il file di log salvato in ``~/Library/Application Support/AURA/replays/``.
*(Per la documentazione completa di installazione e troubleshooting, consulta la [Guida Operativa Playtest macOS](https://github.com/naturewhisp/aura/blob/fase6/docs/MACOS_PLAYTEST_GUIDE.md)).*
"@
          } else { "" }

          $notes = @"
          # A.U.R.A. v$ver ($chan / $kind)

          Source Commit: ``$sha`` (Branch/Ref: ``$ref``)
          $isCandidateMsg
          ## Componenti inclusi
          - **Applicazione Desktop**: Flutter Release Windows x64
          $macComponent- **Runtime Local Inference**: llama.cpp ($llamaCppTag) multi-variante
            - ``win-x64-cuda`` (NVIDIA CUDA 12)
            - ``win-x64-vulkan`` (Vulkan API Generic)
            - ``win-x64-cpu-avx2`` (CPU High-Performance Fallback)
          - **Audio Set**: Default Release Audio Set (48kHz/22kHz PCM WAV)
          - **Firma Cataloghi**: Ed25519 (RFC 8032) / JCS (RFC 8785) verified

          ## Nota Modelli
          I pacchetti di distribuzione **NON** includono file di modello GGUF. Il primo avvio dell'applicazione guidata o il pannello impostazioni provvedera al download verificato del modello.
          $macInstructions
          ## Istruzioni per la verifica Checksum
          Scarica ``AURA-$ver-SHA256SUMS.txt`` e verifica gli hash:
          ```powershell
          Get-FileHash -Algorithm SHA256 aura-v$ver-win-x64.zip
          ```
          "@

          Set-Content -Path "release\RELEASE_NOTES.md" -Value $notes -Encoding UTF8

      - name: Create Git Tag & Draft Release on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.params.outputs.version }}"
          $tag = "v$ver"
          $commit = "${{ github.sha }}"
          $isPrerelease = "${{ steps.params.outputs.release_kind }}" -eq "candidate"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a $tag $commit -m "Release $tag"
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] Push git tag $tag fallito" }

          Write-Host "Creazione GitHub Draft Release per $tag ancorata a $commit..."
          $argsList = @(
              "release", "create", $tag,
              "--target", $commit,
              "--title", "A.U.R.A. $tag",
              "--notes-file", "release\RELEASE_NOTES.md",
              "--draft"
          )
          if ($isPrerelease) {
              $argsList += "--prerelease"
          }

          $assets = Get-ChildItem -Path "release" -File | Where-Object { $_.Name -ne "RELEASE_NOTES.md" }
          foreach ($a in $assets) {
              $argsList += $a.FullName
          }

          gh @argsList
          if ($LASTEXITCODE -ne 0) { throw "[FAIL-CLOSED] Creazione della Draft Release su GitHub fallita" }
          Write-Host "✅ Draft Release $tag creata con successo ancorata a $commit!"

      - name: Upload Diagnostic Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-release-diagnostics-v${{ steps.params.outputs.version }}
          path: release/
          retention-days: ${{ steps.params.outputs.release_kind == 'official' && 30 || 5 }}
