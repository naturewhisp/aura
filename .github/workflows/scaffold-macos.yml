name: One-Shot macOS Scaffolding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Generate app/macos and app/.metadata
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Run Flutter Create for macOS
        run: |
          cd app
          flutter create --platforms=macos --org com.naturewhisp --project-name aura_app .

      - name: Create Scaffold Archive
        run: |
          tar -czf macos-scaffold.tar.gz app/macos app/.metadata

      - name: Upload Scaffold Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-scaffold
          path: macos-scaffold.tar.gz
          retention-days: 1
