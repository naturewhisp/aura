name: macOS Darwin Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos:
    name: macOS Darwin Validation & Build (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Shared Dart & Flutter Validation
        uses: ./.github/actions/validate-dart-flutter

      - name: Build macOS Release Application
        shell: bash
        run: |
          cd app
          flutter build macos --release

      - name: Validate Mach-O Architecture (Fail-Closed)
        shell: bash
        run: |
          APP="app/build/macos/Build/Products/Release/aura_app.app"
          BIN="$APP/Contents/MacOS/aura_app"

          if [ ! -d "$APP" ]; then
            echo "::error::Bundle directory missing: $APP"
            exit 1
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::Executable binary missing: $BIN"
            exit 1
          fi

          echo "=== Host Architecture ==="
          uname -m

          echo "=== Binary File Info ==="
          file "$BIN"

          ARCHS="$(lipo -archs "$BIN")"
          echo "=== Mach-O Architectures: $ARCHS ==="

          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::Expected arm64-only Mach-O, got: $ARCHS"
            exit 1
          fi
          echo "✅ Mach-O architecture strictly verified as arm64!"

      - name: Validate Compiled Entitlements & Signature (Fail-Closed)
        shell: bash
        run: |
          APP="app/build/macos/Build/Products/Release/aura_app.app"

          echo "=== Codesign Verification ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "=== Extracted Compiled Entitlements ==="
          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP" 2>&1)
          echo "$ENTITLEMENTS"

          if ! echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "::error::Missing com.apple.security.app-sandbox entitlement"
            exit 1
          fi

          if ! echo "$ENTITLEMENTS" | grep -q "com.apple.security.network.client"; then
            echo "::error::Missing com.apple.security.network.client entitlement"
            exit 1
          fi

          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.network.server"; then
            echo "::error::Forbidden com.apple.security.network.server found in Release entitlements!"
            exit 1
          fi

          echo "✅ Compiled entitlements & signatures strictly verified!"

      - name: Package macOS Application Bundle (ditto)
        shell: bash
        run: |
          ditto -c -k --keepParent app/build/macos/Build/Products/Release/aura_app.app aura_app-macos-arm64.zip

      - name: Upload macOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura_app-macos-arm64
          path: aura_app-macos-arm64.zip
          retention-days: 7
