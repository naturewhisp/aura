name: Cleanup Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact Tag to delete (e.g. phase6-release-test-0.1.0-rc.1 or v0.1.0-rc.1)'
        required: true
        type: string
      confirm_string:
        description: 'Confirmation string (MUST be DELETE-<tag>)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete Candidate Draft Release & Tag
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Tag & Confirmation String
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          CONFIRM="${{ inputs.confirm_string }}"
          EXPECTED="DELETE-${TAG}"

          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "[FAIL-CLOSED] Stringa di conferma errata! Attesa: '$EXPECTED', Ricevuta: '$CONFIRM'"
            exit 1
          fi

          # Safety Check: rifiuta la cancellazione di tag stable ufficiali
          if [[ "$TAG" != phase6-release-test-* ]] && [[ "$TAG" != *-rc.* ]] && [[ "$TAG" != *-beta.* ]] && [[ "$TAG" != *-dev.* ]]; then
            echo "[FAIL-CLOSED] Il workflow di cleanup puo eliminare solo tag di test phase6-release-test-* o release candidate (rc/beta/dev). Tag stabili ($TAG) rifiutati."
            exit 1
          fi

          echo "✅ Tag di candidate/test e stringa di conferma validi per $TAG"

      - name: Verify & Delete Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"

          echo "Interrogazione stato release su GitHub per $TAG..."
          RELEASE_INFO=$(gh release view "$TAG" --json isDraft,isPrerelease,name 2>/dev/null || echo "NOT_FOUND")

          if [ "$RELEASE_INFO" = "NOT_FOUND" ]; then
            echo "[FAIL-CLOSED] Nessuna release trovata per il tag $TAG"
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')

          if [ "$IS_DRAFT" != "true" ]; then
            echo "[FAIL-CLOSED] La release $TAG risulta gia pubblicata! Impossibile eliminare una release pubblicata."
            exit 1
          fi

          echo "Eliminazione Draft Release $TAG..."
          gh release delete "$TAG" --yes --cleanup-tag

          echo "✅ Draft Release e tag $TAG eliminati con successo!"
